name: Cleanup history

# Trims the asset_history and interactions tables on a rolling window so
# the Supabase free-tier database (500 MB) never fills up, even when the
# simulator is pumping ~150 PUTs every few seconds against the deployed
# Flask backend.
#
# Keeps the most recent 2 hours of data, which is enough for trails,
# playback, heatmap, motion, and recent interaction events to keep working.

on:
  schedule:
    - cron: "0 * * * *"      # every hour, on the hour (UTC)
  workflow_dispatch:           # also allows manual run from the Actions tab

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Show row counts before cleanup
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$DB_URL" -c "
            SELECT 'asset_history' AS tbl, COUNT(*) AS rows FROM asset_history
            UNION ALL
            SELECT 'interactions',  COUNT(*) FROM interactions
            UNION ALL
            SELECT 'assets',        COUNT(*) FROM assets;
          "

      - name: Trim history (keep only the 50 most recent rows per asset)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # Per-asset retention: every asset always has its 50 most recent
          # positions, regardless of when the simulator last ran. This means
          # trails stay visible indefinitely for every asset and storage is
          # bounded at ~150 assets × 50 rows ≈ 7,500 rows total (~750 KB).
          # The trade-off vs. a time window: less dense recent activity for
          # the heatmap, but a guaranteed visible trail at all times.
          psql "$DB_URL" -c "
            DELETE FROM asset_history
            WHERE id NOT IN (
                SELECT id FROM (
                    SELECT id,
                           ROW_NUMBER() OVER (PARTITION BY asset_id
                                              ORDER BY recorded_at DESC) AS rn
                    FROM asset_history
                ) t
                WHERE rn <= 50
            );
          "

      - name: Trim interactions ended more than 24 hours ago
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # Bumped from 2 h to 24 h so the side panel still shows yesterday's
          # encounter feed when someone opens the app cold. Active interactions
          # (ended_at IS NULL) are never touched.
          psql "$DB_URL" -c "
            DELETE FROM interactions
            WHERE ended_at IS NOT NULL
              AND ended_at < NOW() - INTERVAL '24 hours';
          "

      - name: Show row counts after cleanup
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$DB_URL" -c "
            SELECT 'asset_history' AS tbl, COUNT(*) AS rows FROM asset_history
            UNION ALL
            SELECT 'interactions',  COUNT(*) FROM interactions
            UNION ALL
            SELECT 'assets',        COUNT(*) FROM assets;
          "

      - name: Reclaim disk space (VACUUM)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # VACUUM cannot run inside a transaction; -c uses one autocommit txn,
          # so VACUUM works fine here.
          psql "$DB_URL" -c "VACUUM (ANALYZE) asset_history;"
          psql "$DB_URL" -c "VACUUM (ANALYZE) interactions;"
