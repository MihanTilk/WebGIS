<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- For deployed builds, change content to e.g.
       https://asset-tracking-api.onrender.com/api -->
  <meta name="api-root" content="http://localhost:5000/api">
  <title>WebGIS Asset Tracking</title>
  <link rel="stylesheet" href="https://unpkg.com/ol@7.5.2/ol.css">
  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    #map { width: 100%; height: 100vh; }

    #controls {
      position: absolute; top: 12px; right: 12px; z-index: 10;
      background: #fff; padding: 10px 14px; border-radius: 8px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.25); font-size: 14px;
    }
    #controls label { margin-right: 8px; }
    #status { margin-top: 6px; color: #666; font-size: 12px; }

    #controls hr { border: none; border-top: 1px solid #eee; margin: 8px 0; }
    #playback-controls { display: none; }
    #playback-controls #time-slider { width: 240px; margin-top: 4px; display: block; }
    #playback-controls #time-label { font-size: 12px; color: #444; margin-top: 4px; }
    #playback-controls button { padding: 2px 10px; cursor: pointer; }

    .ol-popup {
      position: absolute; background: #fff; padding: 10px 14px;
      border: 1px solid #ccc; border-radius: 8px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.25);
      min-width: 180px; bottom: 14px; left: -90px;
    }
    .ol-popup:after, .ol-popup:before {
      top: 100%; border: solid transparent; content: " ";
      height: 0; width: 0; position: absolute; pointer-events: none;
    }
    .ol-popup:after { border-top-color: #fff; border-width: 10px; left: 50%; margin-left: -10px; }
    .ol-popup:before { border-top-color: #ccc; border-width: 11px; left: 50%; margin-left: -11px; }

    .legend {
      position: absolute; bottom: 14px; left: 14px; z-index: 10;
      background: #fff; padding: 10px 14px; border-radius: 8px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.25); font-size: 13px;
    }
    .legend .row { display: flex; align-items: center; margin: 3px 0; }
    .legend .dot { width: 12px; height: 12px; border-radius: 50%;
                   margin-right: 8px; border: 2px solid #fff;
                   box-shadow: 0 0 0 1px #888; }

    #interactions-panel {
      position: absolute; top: 12px; left: 12px; z-index: 10;
      background: #fff; border-radius: 8px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.25);
      width: 300px; max-height: 55vh;
      display: flex; flex-direction: column; overflow: hidden;
      font-size: 13px;
    }
    #interactions-header {
      padding: 8px 12px; border-bottom: 1px solid #eee;
      display: flex; justify-content: space-between; align-items: center;
      cursor: pointer; user-select: none;
    }
    #interactions-header strong { font-size: 14px; }
    #interactions-count { color: #666; font-size: 12px; }
    #interactions-filters {
      padding: 6px 10px; border-bottom: 1px solid #eee;
      display: flex; flex-wrap: wrap; gap: 4px;
    }
    .kind-chip {
      padding: 2px 8px; border-radius: 12px; font-size: 11px;
      cursor: pointer; user-select: none; border: 1px solid transparent;
    }
    .kind-chip.off { opacity: 0.35; }
    #interactions-list {
      list-style: none; margin: 0; padding: 0;
      overflow-y: auto; flex: 1;
    }
    #interactions-list li {
      padding: 8px 12px; border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
    }
    #interactions-list li:hover { background: #fafafa; }
    .ix-row { display: flex; justify-content: space-between; gap: 6px; }
    .ix-kind { font-weight: bold; font-size: 11px; padding: 1px 6px;
               border-radius: 8px; color: #fff; }
    .ix-meta { color: #888; font-size: 11px; margin-top: 2px; }
    .ix-empty { padding: 14px; color: #888; text-align: center; }
    .ix-active::after { content: "●"; color: #2e7d32; margin-left: 4px; }
    #interactions-collapsed { display: none; }

    #chip-info-popover {
      display: none;
      margin: 4px 10px 6px;
      padding: 8px 10px;
      background: #f7f7f9;
      border-left: 3px solid #888;
      border-radius: 3px;
      font-size: 11px;
      color: #333;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="controls">
    <label for="filter">Show:</label>
    <select id="filter">
      <option value="">All</option>
      <option value="vehicle">Vehicles</option>
      <option value="person">People</option>
      <option value="equipment">Equipment</option>
    </select>
    <button id="fit-btn" style="margin-left:6px;padding:2px 8px;cursor:pointer;">Fit to all</button>
    <div id="status">loading…</div>

    <hr>
    <div>
      <label><input type="radio" name="mode" value="live" checked> Live</label>
      <label><input type="radio" name="mode" value="playback"> Playback</label>
    </div>
    <div id="playback-controls">
      <button id="play-btn">▶ Play</button>
      <label for="speed" style="margin-left:6px;">Speed:</label>
      <select id="speed">
        <option value="60">1×</option>
        <option value="300" selected>5×</option>
        <option value="1800">30×</option>
      </select>
      <input type="range" id="time-slider" min="0" max="100" value="100">
      <div id="time-label">—</div>
    </div>

    <hr>
    <div>
      <label><input type="checkbox" id="heatmap-toggle"> Density heatmap</label>
      <select id="heatmap-hours" style="margin-left:4px;">
        <option value="1">1h</option>
        <option value="6">6h</option>
        <option value="24" selected>24h</option>
        <option value="72">3d</option>
      </select>
      <div id="heatmap-status" style="font-size:12px;color:#666;margin-top:2px;"></div>
    </div>

    <hr>
    <div>
      <label><input type="checkbox" id="proximity-toggle"> Proximity search</label>
      <div style="margin-top:4px;">
        <label for="proximity-radius" style="font-size:12px;">Radius:</label>
        <input type="range" id="proximity-radius" min="100" max="50000" step="100" value="5000"
               style="vertical-align:middle; width:140px;">
        <span id="proximity-radius-label" style="font-size:12px;">5.0 km</span>
      </div>
      <div id="proximity-status" style="font-size:12px;color:#666;margin-top:2px;"></div>
    </div>
  </div>

  <div class="legend">
    <div><strong>Asset types</strong></div>
    <div class="row"><span class="dot" style="background:#1976d2"></span>Vehicle</div>
    <div class="row"><span class="dot" style="background:#e53935"></span>Person</div>
    <div class="row"><span class="dot" style="background:#43a047"></span>Equipment</div>
  </div>

  <div id="popup" class="ol-popup" style="display:none;">
    <div id="popup-content"></div>
  </div>

  <div id="interactions-panel">
    <div id="interactions-header">
      <strong>Interactions</strong>
      <span id="interactions-count">—</span>
    </div>
    <div id="interactions-filters"></div>
    <div id="chip-info-popover"></div>
    <ul id="interactions-list">
      <li class="ix-empty">No interactions yet.</li>
    </ul>
  </div>

  <script src="https://unpkg.com/ol@7.5.2/dist/ol.js"
          onerror="document.getElementById('status').textContent='Failed to load OpenLayers from CDN'"></script>
  <script>
    // For deployment: change the meta[name="api-root"] tag in <head>, or
    // pass the URL via an api_root query string. Defaults to localhost dev.
    const API_ROOT = (
      new URLSearchParams(location.search).get('api_root')
      || document.querySelector('meta[name="api-root"]')?.content
      || "http://localhost:5000/api"
    ).replace(/\/$/, '');
    const API_BASE = `${API_ROOT}/assets`;
    const REFRESH_MS = 5000;
    const PLAYBACK_TICK_MS = 1000;  // wall-clock cadence while playing

    const COLORS = { vehicle: '#1976d2', person: '#e53935', equipment: '#43a047' };

    // Set of asset IDs currently matched by the proximity query.
    let matchedAssetIds = new Set();
    let proximityActive = false;
    let lastProximityClick = null;
    // Set of asset IDs explicitly highlighted (e.g. the two parties of a
    // clicked interaction event). Overrides the proximity styling.
    let highlightedAssetIds = new Set();

    function styleFor(feature) {
      const color = COLORS[feature.get('asset_type')] || '#555';
      const id = feature.get('id');

      // Explicit highlight wins over everything else.
      if (highlightedAssetIds.has(id)) {
        return new ol.style.Style({
          image: new ol.style.Circle({
            radius: 13,
            fill: new ol.style.Fill({ color }),
            stroke: new ol.style.Stroke({ color: '#FFD700', width: 5 })
          })
        });
      }

      if (proximityActive && lastProximityClick !== null) {
        if (matchedAssetIds.has(id)) {
          return new ol.style.Style({
            image: new ol.style.Circle({
              radius: 10,
              fill: new ol.style.Fill({ color }),
              stroke: new ol.style.Stroke({ color: '#FFD700', width: 4 })
            })
          });
        }
        return new ol.style.Style({
          image: new ol.style.Circle({
            radius: 5,
            fill: new ol.style.Fill({ color: 'rgba(120,120,120,0.35)' }),
            stroke: new ol.style.Stroke({ color: 'rgba(255,255,255,0.6)', width: 1 })
          })
        });
      }

      return new ol.style.Style({
        image: new ol.style.Circle({
          radius: 8,
          fill: new ol.style.Fill({ color }),
          stroke: new ol.style.Stroke({ color: '#fff', width: 2 })
        })
      });
    }

    const vectorSource = new ol.source.Vector();
    const vectorLayer  = new ol.layer.Vector({ source: vectorSource, style: styleFor });

    // Movement-history trail (drawn under markers)
    const trailSource = new ol.source.Vector();
    const trailLayer  = new ol.layer.Vector({
      source: trailSource,
      style: feature => {
        const color = COLORS[feature.get('asset_type')] || '#555';
        return new ol.style.Style({
          stroke: new ol.style.Stroke({ color, width: 3, lineDash: [6, 6] })
        });
      }
    });

    // Density heatmap of historical positions. Recency-decay weight comes
    // from the backend; OpenLayers' Heatmap does the kernel density.
    const heatmapSource = new ol.source.Vector();
    const heatmapLayer  = new ol.layer.Heatmap({
      source: heatmapSource,
      blur: 18,
      radius: 12,
      weight: f => f.get('weight') ?? 0.5,
      visible: false,
    });

    // Direction arrow for the most recently clicked asset. SVG data URL gives
    // us a real arrow (head + shaft) instead of a generic triangle / star.
    function arrowDataUrl(fillColor) {
      const svg =
        `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="40" viewBox="0 0 32 40">`
        + `<path d="M16 2 L28 18 L20 18 L20 38 L12 38 L12 18 L4 18 Z" `
        + `fill="${fillColor}" stroke="#222" stroke-width="2" stroke-linejoin="round"/>`
        + `</svg>`;
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    }

    const directionSource = new ol.source.Vector();
    const directionLayer  = new ol.layer.Vector({
      source: directionSource,
      style: feature => {
        const headingRad = (feature.get('heading_deg') ?? 0) * Math.PI / 180;
        const movingFast = (feature.get('speed_kmh') ?? 0) >= 5;
        return new ol.style.Style({
          image: new ol.style.Icon({
            src: arrowDataUrl(movingFast ? '#FFD54F' : '#FFFFFF'),
            size: [32, 40],
            scale: 0.9,
            rotation: headingRad,
            rotateWithView: true,
            anchor: [0.5, 0.5],
          })
        });
      }
    });

    // SVG icons load asynchronously — force a redraw once the load fires.
    directionSource.on('addfeature', () => {
      setTimeout(() => directionLayer.changed(), 50);
    });

    // Interaction events — star icons at the encounter midpoint, color by kind.
    const KIND_COLORS = {
      PICKUP:    '#FF7043',
      LOADING:   '#FFA726',
      OPERATING: '#66BB6A',
      MEETING:   '#42A5F5',
      CONVOY:    '#AB47BC',
    };
    // Per-kind metadata — populated at startup from /api/interactions/rules
    // so the info-icon tooltip text matches what the backend actually enforces.
    const kindMeta = {};   // { PICKUP: { type_a, type_b, distance_m, min_duration_s }, ... }
    function ruleTooltip(kind) {
      const m = kindMeta[kind];
      if (!m) return kind;
      return `${kind}\n${m.type_a} ↔ ${m.type_b}\n`
           + `within ${m.distance_m} m for ≥ ${m.min_duration_s}s`;
    }
    const interactionSource = new ol.source.Vector();
    const interactionLayer  = new ol.layer.Vector({
      source: interactionSource,
      style: f => {
        const color = KIND_COLORS[f.get('kind')] || '#999';
        const active = f.get('active');
        return new ol.style.Style({
          image: new ol.style.RegularShape({
            points: 5,
            radius: active ? 11 : 8,
            radius2: active ? 5 : 3.5,
            angle: 0,
            fill: new ol.style.Fill({ color }),
            stroke: new ol.style.Stroke({ color: '#fff', width: 1.5 })
          })
        });
      }
    });

    // Encounter pinpoint: a circular border drawn at the meeting midpoint
    // when the user clicks an event in the side panel. Radius = the rule's
    // proximity threshold, so the circle visually shows "this is the area
    // they were both inside when the event fired".
    const encounterSource = new ol.source.Vector();
    const encounterLayer  = new ol.layer.Vector({
      source: encounterSource,
      style: f => new ol.style.Style({
        stroke: new ol.style.Stroke({
          color: KIND_COLORS[f.get('kind')] || '#FFD700',
          width: 3,
        }),
        fill: new ol.style.Fill({ color: 'rgba(255,215,0,0.10)' })
      })
    });

    // Proximity search circle (drawn under markers so it doesn't block clicks).
    const proximitySource = new ol.source.Vector();
    const proximityLayer  = new ol.layer.Vector({
      source: proximitySource,
      style: new ol.style.Style({
        stroke: new ol.style.Stroke({ color: 'rgba(255,140,0,0.85)', width: 2, lineDash: [5,5] }),
        fill:   new ol.style.Fill({   color: 'rgba(255,140,0,0.10)' })
      })
    });

    const map = new ol.Map({
      target: 'map',
      layers: [
        new ol.layer.Tile({ source: new ol.source.OSM() }),
        heatmapLayer,      // above tiles
        proximityLayer,    // above heatmap
        encounterLayer,    // selected-event circle (under markers)
        trailLayer,
        directionLayer,    // arrow above trail
        interactionLayer,  // event stars between trail and markers
        vectorLayer        // markers stay on top so clicks always hit them
      ],
      view: new ol.View({
        center: ol.proj.fromLonLat([79.88, 6.90]),
        zoom: 14
      })
    });

    // Popup overlay
    const popupEl      = document.getElementById('popup');
    const popupContent = document.getElementById('popup-content');
    const popup = new ol.Overlay({
      element: popupEl, positioning: 'bottom-center',
      stopEvent: false, offset: [0, -10]
    });
    map.addOverlay(popup);

    async function showTrail(assetId, assetType) {
      trailSource.clear();
      try {
        const res = await fetch(`${API_BASE}/${assetId}/history?hours=1`,
                                { cache: 'no-store' });
        const data = await res.json();
        const count = data.metadata?.point_count ?? 0;
        if (!data.features.length) return count;
        const features = new ol.format.GeoJSON().readFeatures(data, {
          featureProjection: 'EPSG:3857'
        });
        features.forEach(f => f.set('asset_type', assetType));
        trailSource.addFeatures(features);
        return count;
      } catch (e) {
        console.error('trail fetch failed', e);
        return 0;
      }
    }

    async function showDirectionArrow(assetId, assetCoord) {
      directionSource.clear();
      try {
        const res = await fetch(`${API_BASE}/${assetId}/motion`, { cache: 'no-store' });
        const data = await res.json();
        if (data.heading_deg == null) return null;
        directionSource.addFeature(new ol.Feature({
          geometry: new ol.geom.Point(assetCoord),
          heading_deg: data.heading_deg,
          speed_kmh: data.speed_kmh,
        }));
        return data;
      } catch (e) {
        console.error('motion fetch failed', e);
        return null;
      }
    }

    function renderPopup(feature) {
      // Build with DOM nodes (textContent is XSS-safe).
      const seen = feature.get('last_seen');
      popupContent.replaceChildren();

      const name = document.createElement('strong');
      name.textContent = feature.get('name') ?? '';
      const type = document.createElement('em');
      type.textContent = feature.get('asset_type') ?? '';
      const idLine    = document.createTextNode(`ID: ${feature.get('id')}`);
      const seenLine  = document.createTextNode(
        'Last seen: ' + (seen ? new Date(seen).toLocaleString() : '—')
      );

      popupContent.append(name, document.createElement('br'),
                          type, document.createElement('br'),
                          idLine, document.createElement('br'),
                          seenLine, document.createElement('br'));

      // WGS84 lat/lon (EPSG:4326)
      const lat = feature.get('lat');
      const lon = feature.get('lon');
      if (lat != null && lon != null) {
        const wgs = document.createElement('div');
        wgs.style.fontSize = '12px';
        wgs.style.color = '#333';
        wgs.textContent = `WGS84: ${lat.toFixed(5)}, ${lon.toFixed(5)}`;
        popupContent.appendChild(wgs);
      }

      // Sri Lanka Kandawala Grid (EPSG:5234) — TM, locally conformal.
      const e = feature.get('easting');
      const n = feature.get('northing');
      if (e != null && n != null) {
        const slg = document.createElement('div');
        slg.style.fontSize = '12px';
        slg.style.color = '#555';
        slg.title = 'EPSG:5234 — Sri Lanka Kandawala Grid (Transverse Mercator)';
        slg.textContent = `SLG: E ${e.toFixed(1)}, N ${n.toFixed(1)} m`;
        popupContent.appendChild(slg);
      }

      const trailLine = document.createElement('span');
      trailLine.id = 'trail-info';
      trailLine.textContent = 'Loading trail…';
      popupContent.appendChild(document.createElement('br'));
      popupContent.appendChild(trailLine);

      const motionLine = document.createElement('div');
      motionLine.id = 'motion-info';
      motionLine.style.fontSize = '11px';
      motionLine.style.color = '#666';
      motionLine.style.marginTop = '2px';
      motionLine.textContent = 'Loading speed…';
      popupContent.appendChild(motionLine);
    }

    // ---------- Proximity search ----------
    const proximityToggle      = document.getElementById('proximity-toggle');
    const proximityRadius      = document.getElementById('proximity-radius');
    const proximityRadiusLabel = document.getElementById('proximity-radius-label');
    const proximityStatus      = document.getElementById('proximity-status');

    function fmtRadius(m) {
      return m >= 1000 ? `${(m / 1000).toFixed(1)} km` : `${m} m`;
    }
    function updateRadiusLabel() {
      proximityRadiusLabel.textContent = fmtRadius(Number(proximityRadius.value));
    }
    updateRadiusLabel();

    // Build a polygon approximation of a circle on the WGS84 spheroid,
    // then transform to Web Mercator for display. Avoids the latitude
    // distortion you get from ol.geom.Circle in EPSG:3857.
    function geographicCirclePolygon(centerLon, centerLat, radiusM, sides = 96) {
      const coords = [];
      const dLat = radiusM / 111320;
      const cosLat = Math.cos(centerLat * Math.PI / 180);
      for (let i = 0; i <= sides; i++) {
        const a = (i / sides) * 2 * Math.PI;
        coords.push([
          centerLon + (Math.cos(a) * dLat) / cosLat,
          centerLat +  Math.sin(a) * dLat
        ]);
      }
      const poly = new ol.geom.Polygon([coords]);
      poly.transform('EPSG:4326', 'EPSG:3857');
      return poly;
    }

    async function runProximity(lon, lat) {
      const radius_m = Number(proximityRadius.value);
      lastProximityClick = { lon, lat, radius_m };

      // Draw the circle
      proximitySource.clear();
      proximitySource.addFeature(new ol.Feature({
        geometry: geographicCirclePolygon(lon, lat, radius_m),
        kind: 'search-circle'
      }));

      // Hit the API
      const type = filterEl.value;
      const params = new URLSearchParams({ lon, lat, radius_m });
      if (type) params.set('type', type);
      proximityStatus.textContent = `Searching within ${fmtRadius(radius_m)}…`;
      try {
        const res = await fetch(`${API_ROOT}/proximity?${params}`, { cache: 'no-store' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || res.statusText);

        matchedAssetIds = new Set(
          data.features.map(f => f.properties.id).filter(id => id != null)
        );
        vectorLayer.changed();   // re-style markers
        proximityStatus.textContent =
          `${data.metadata.count} asset${data.metadata.count === 1 ? '' : 's'} `
          + `within ${fmtRadius(radius_m)}`;
      } catch (err) {
        console.error('proximity failed', err);
        proximityStatus.textContent = 'API error: ' + err.message;
      }
    }

    function clearProximity() {
      proximitySource.clear();
      matchedAssetIds = new Set();
      lastProximityClick = null;
      proximityStatus.textContent = '';
      vectorLayer.changed();
    }

    proximityToggle.addEventListener('change', () => {
      proximityActive = proximityToggle.checked;
      if (proximityActive) {
        popupEl.style.display = 'none';
        trailSource.clear();
        directionSource.clear();
        proximityStatus.textContent = 'Click anywhere on the map.';
      } else {
        clearProximity();
      }
      vectorLayer.changed();
    });

    proximityRadius.addEventListener('input', () => {
      updateRadiusLabel();
      // Live re-query at the last click while sliding.
      if (proximityActive && lastProximityClick) {
        runProximity(lastProximityClick.lon, lastProximityClick.lat);
      }
    });

    map.on('singleclick', async evt => {
      // Proximity mode hijacks the click.
      if (proximityActive) {
        const [lon, lat] = ol.proj.toLonLat(evt.coordinate);
        await runProximity(lon, lat);
        return;
      }

      const feature = map.forEachFeatureAtPixel(evt.pixel, f => f, {
        layerFilter: layer => layer === vectorLayer
      });
      if (feature) {
        renderPopup(feature);
        popup.setPosition(evt.coordinate);
        popupEl.style.display = 'block';

        const assetCoord = feature.getGeometry().getCoordinates();
        const [trailCount, motion] = await Promise.all([
          showTrail(feature.get('id'), feature.get('asset_type')),
          showDirectionArrow(feature.get('id'), assetCoord),
        ]);

        const info = document.getElementById('trail-info');
        if (info) {
          info.textContent = trailCount >= 2
            ? `Trail: ${trailCount} positions in last hour`
            : trailCount === 1
              ? 'Trail: only origin point so far'
              : 'Trail: no history yet';
        }
        const motionEl = document.getElementById('motion-info');
        if (motionEl) {
          if (motion && motion.heading_deg != null) {
            motionEl.textContent =
              `Speed: ${motion.speed_kmh.toFixed(1)} km/h · `
              + `Heading: ${motion.heading_deg.toFixed(0)}°`;
          } else {
            motionEl.textContent = 'Motion: not enough history';
          }
        }
      } else {
        popupEl.style.display = 'none';
        trailSource.clear();
        directionSource.clear();
        encounterSource.clear();
        if (highlightedAssetIds.size) {
          highlightedAssetIds = new Set();
          vectorLayer.changed();
        }
      }
    });

    // Periodic refresh
    const filterEl = document.getElementById('filter');
    const statusEl = document.getElementById('status');

    async function refresh() {
      const type = filterEl.value;
      const url  = type ? `${API_BASE}?type=${encodeURIComponent(type)}` : API_BASE;
      try {
        const res  = await fetch(url, { cache: 'no-store' });
        const data = await res.json();
        const features = new ol.format.GeoJSON().readFeatures(data, {
          featureProjection: 'EPSG:3857' // map is Web Mercator; data is WGS84
        });
        vectorSource.clear();
        vectorSource.addFeatures(features);
        statusEl.textContent =
          `${features.length} asset${features.length === 1 ? '' : 's'} · `
          + new Date().toLocaleTimeString();
      } catch (err) {
        console.error('refresh failed', err);
        statusEl.textContent = 'API error: ' + err.message;
      }
    }

    // ------- Playback state -------
    const playbackEl = document.getElementById('playback-controls');
    const sliderEl   = document.getElementById('time-slider');
    const timeLabel  = document.getElementById('time-label');
    const playBtn    = document.getElementById('play-btn');
    const speedEl    = document.getElementById('speed');
    const modeRadios = document.querySelectorAll('input[name="mode"]');

    let mode = 'live';                  // 'live' | 'playback'
    let liveInterval = null;
    let playInterval = null;
    let playing = false;
    let range = { earliest: null, latest: null };  // ms epoch
    let snapshotInflight = null;

    async function fetchRange() {
      const res = await fetch(`${API_ROOT}/history/range`, { cache: 'no-store' });
      const data = await res.json();
      const earliest = data.earliest ? new Date(data.earliest).getTime() : null;
      const latest   = data.latest   ? new Date(data.latest).getTime()   : null;
      return { earliest, latest };
    }

    async function fetchSnapshot(atMs) {
      const at = new Date(atMs).toISOString();
      const type = filterEl.value;
      const params = new URLSearchParams({ at });
      if (type) params.set('type', type);
      const res = await fetch(`${API_ROOT}/snapshot?${params}`, { cache: 'no-store' });
      if (!res.ok) throw new Error(`snapshot ${res.status}`);
      return res.json();
    }

    function sliderToTime() {
      if (range.earliest == null || range.latest == null) return null;
      const span = range.latest - range.earliest;
      return range.earliest + (span * Number(sliderEl.value)) / Number(sliderEl.max);
    }

    function timeToSlider(tMs) {
      if (range.earliest == null || range.latest == null) return 0;
      const span = range.latest - range.earliest;
      if (span <= 0) return Number(sliderEl.max);
      const v = ((tMs - range.earliest) / span) * Number(sliderEl.max);
      return Math.max(0, Math.min(Number(sliderEl.max), v));
    }

    async function renderSnapshot() {
      const t = sliderToTime();
      if (t == null) return;
      timeLabel.textContent = new Date(t).toLocaleString();
      // De-dupe overlapping requests when scrubbing fast.
      const ticket = (snapshotInflight = Symbol('snap'));
      try {
        const data = await fetchSnapshot(t);
        if (ticket !== snapshotInflight) return;
        const features = new ol.format.GeoJSON().readFeatures(data, {
          featureProjection: 'EPSG:3857'
        });
        vectorSource.clear();
        vectorSource.addFeatures(features);
        statusEl.textContent =
          `${features.length} asset${features.length === 1 ? '' : 's'} @ playback`;
      } catch (err) {
        if (ticket !== snapshotInflight) return;
        console.error('snapshot failed', err);
        statusEl.textContent = 'API error: ' + err.message;
      }
    }

    function stopPlay() {
      playing = false;
      playBtn.textContent = '▶ Play';
      if (playInterval) { clearInterval(playInterval); playInterval = null; }
    }

    function startPlay() {
      if (range.earliest == null || range.latest == null) return;
      playing = true;
      playBtn.textContent = '❚❚ Pause';
      const stepSeconds = Number(speedEl.value);  // sim seconds per wall second
      playInterval = setInterval(() => {
        const t = sliderToTime();
        if (t == null) return stopPlay();
        const next = t + stepSeconds * 1000;
        if (next >= range.latest) {
          sliderEl.value = sliderEl.max;
          renderSnapshot();
          stopPlay();
          return;
        }
        sliderEl.value = timeToSlider(next);
        renderSnapshot();
      }, PLAYBACK_TICK_MS);
    }

    async function enterPlayback() {
      mode = 'playback';
      if (liveInterval) { clearInterval(liveInterval); liveInterval = null; }
      trailSource.clear();
      directionSource.clear();
      encounterSource.clear();
      if (highlightedAssetIds.size) {
        highlightedAssetIds = new Set();
        vectorLayer.changed();
      }
      popupEl.style.display = 'none';
      playbackEl.style.display = 'block';
      try {
        range = await fetchRange();
      } catch (err) {
        statusEl.textContent = 'history range failed: ' + err.message;
        return;
      }
      if (range.earliest == null) {
        statusEl.textContent = 'no history yet — let the simulator run first';
        return;
      }
      sliderEl.value = sliderEl.max;  // start at "latest"
      await renderSnapshot();
    }

    function enterLive() {
      mode = 'live';
      stopPlay();
      playbackEl.style.display = 'none';
      refresh();
      liveInterval = setInterval(refresh, REFRESH_MS);
    }

    modeRadios.forEach(r => r.addEventListener('change', e => {
      if (e.target.value === 'playback') enterPlayback();
      else enterLive();
    }));

    sliderEl.addEventListener('input', () => {
      if (playing) stopPlay();
      renderSnapshot();
    });

    playBtn.addEventListener('click', () => {
      if (playing) { stopPlay(); return; }
      // If we're at the end, rewind to start before playing.
      if (Number(sliderEl.value) >= Number(sliderEl.max)) sliderEl.value = 0;
      startPlay();
    });

    speedEl.addEventListener('change', () => {
      if (playing) { stopPlay(); startPlay(); }
    });

    filterEl.addEventListener('change', () => {
      // Filter scope changed: any clicked-asset / clicked-interaction state
      // may now point at assets no longer shown. Clear all selection visuals.
      popupEl.style.display = 'none';
      trailSource.clear();
      directionSource.clear();
      encounterSource.clear();
      if (highlightedAssetIds.size) {
        highlightedAssetIds = new Set();
        vectorLayer.changed();
      }
      if (mode === 'live') refresh();
      else renderSnapshot();
      refreshHeatmap();
    });

    document.getElementById('fit-btn').addEventListener('click', () => {
      const extent = vectorSource.getExtent();
      // Empty source returns [Infinity, Infinity, -Infinity, -Infinity]
      if (!isFinite(extent[0])) return;
      map.getView().fit(extent, { padding: [60, 60, 60, 60], maxZoom: 16, duration: 400 });
    });

    // ------- Heatmap -------
    const heatmapToggle = document.getElementById('heatmap-toggle');
    const heatmapHoursEl = document.getElementById('heatmap-hours');
    const heatmapStatusEl = document.getElementById('heatmap-status');

    async function refreshHeatmap() {
      if (!heatmapToggle.checked) {
        heatmapLayer.setVisible(false);
        heatmapSource.clear();
        heatmapStatusEl.textContent = '';
        return;
      }
      const params = new URLSearchParams({ hours: heatmapHoursEl.value });
      if (filterEl.value) params.set('type', filterEl.value);
      try {
        const res = await fetch(`${API_ROOT}/heatmap?${params}`, { cache: 'no-store' });
        const data = await res.json();
        const features = new ol.format.GeoJSON().readFeatures(data, {
          featureProjection: 'EPSG:3857'
        });
        heatmapSource.clear();
        heatmapSource.addFeatures(features);
        heatmapLayer.setVisible(true);
        const n = data.metadata?.count ?? features.length;
        const t = data.metadata?.type || 'all';
        heatmapStatusEl.textContent = `${n} positions · ${t} · last ${heatmapHoursEl.value}h`;
      } catch (err) {
        console.error('heatmap fetch failed', err);
        heatmapStatusEl.textContent = 'heatmap error: ' + err.message;
      }
    }

    heatmapToggle.addEventListener('change', refreshHeatmap);
    heatmapHoursEl.addEventListener('change', refreshHeatmap);
    setInterval(() => { if (heatmapToggle.checked) refreshHeatmap(); }, 30000);

    // ---------- Interactions panel ----------
    const ixPanel    = document.getElementById('interactions-panel');
    const ixHeader   = document.getElementById('interactions-header');
    const ixCount    = document.getElementById('interactions-count');
    const ixFilters  = document.getElementById('interactions-filters');
    const ixList     = document.getElementById('interactions-list');

    const enabledKinds = new Set(Object.keys(KIND_COLORS));   // all on by default
    let panelCollapsed = false;

    // Shared popover that surfaces a rule's full definition when the user
    // clicks the ⓘ on any filter chip. Click again on the same icon to hide.
    const chipPopover = document.getElementById('chip-info-popover');
    let chipPopoverActiveKind = null;

    function showChipPopover(kind, anchorColor) {
      if (chipPopoverActiveKind === kind) {
        chipPopover.style.display = 'none';
        chipPopoverActiveKind = null;
        return;
      }
      const m = kindMeta[kind];
      chipPopover.style.borderLeftColor = anchorColor;
      chipPopover.textContent = m
        ? `${kind}\nRule: ${m.type_a} ↔ ${m.type_b}\nProximity: within ${m.distance_m} m\nMinimum dwell: ≥ ${m.min_duration_s} s`
        : `${kind}\n(rule metadata not loaded yet — refresh in a moment)`;
      chipPopover.style.display = 'block';
      chipPopoverActiveKind = kind;
    }

    // Click anywhere outside the chip popover or its source ⓘ icon dismisses it.
    document.addEventListener('click', evt => {
      if (chipPopoverActiveKind === null) return;
      if (chipPopover.contains(evt.target)) return;
      if (evt.target.dataset && evt.target.dataset.role === 'info'
          && evt.target.parentElement && evt.target.parentElement.classList.contains('kind-chip')) {
        return; // Let the chip's own handler decide what to do.
      }
      chipPopover.style.display = 'none';
      chipPopoverActiveKind = null;
    });

    // Build filter chips.
    Object.keys(KIND_COLORS).forEach(kind => {
      const chip = document.createElement('span');
      chip.className = 'kind-chip';
      chip.dataset.kind = kind;
      chip.style.background = KIND_COLORS[kind] + '20';
      chip.style.borderColor = KIND_COLORS[kind];
      chip.style.color = '#222';

      const label = document.createElement('span');
      label.textContent = kind;

      const info = document.createElement('span');
      info.textContent = ' ⓘ';
      info.style.cursor = 'pointer';
      info.style.color = '#1976d2';
      info.style.fontWeight = 'bold';
      info.title = 'Click for rule details';
      info.dataset.role = 'info';

      chip.append(label, info);
      chip.title = `Click ${kind} to toggle filter`;

      // Clicking the ⓘ shows the popover; clicking the rest of the chip toggles.
      info.addEventListener('click', evt => {
        evt.stopPropagation();
        showChipPopover(kind, KIND_COLORS[kind]);
      });
      chip.addEventListener('click', evt => {
        if (evt.target.dataset.role === 'info') return;
        if (enabledKinds.has(kind)) {
          enabledKinds.delete(kind);
          chip.classList.add('off');
        } else {
          enabledKinds.add(kind);
          chip.classList.remove('off');
        }
        renderInteractions(latestInteractions);
      });
      ixFilters.appendChild(chip);
    });

    async function loadInteractionRules() {
      try {
        const res = await fetch(`${API_ROOT}/interactions/rules`, { cache: 'no-store' });
        const rules = await res.json();
        rules.forEach(r => { kindMeta[r.kind] = r; });
        // Refresh chip tooltips (the "ⓘ" hover text on filter chips).
        ixFilters.querySelectorAll('[data-role="info"]').forEach(el => {
          el.title = ruleTooltip(el.parentElement.dataset.kind);
        });
        // Force a re-render of the side panel so list items pick up the new
        // metadata in their collapsible info sections.
        renderInteractions(latestInteractions);
      } catch (e) {
        console.error('rules fetch failed', e);
      }
    }
    loadInteractionRules();

    ixHeader.addEventListener('click', () => {
      panelCollapsed = !panelCollapsed;
      ixFilters.style.display = panelCollapsed ? 'none' : '';
      ixList.style.display    = panelCollapsed ? 'none' : '';
    });

    function fmtDuration(s) {
      if (s < 60) return `${s}s`;
      if (s < 3600) return `${Math.round(s / 60)}m`;
      return `${(s / 3600).toFixed(1)}h`;
    }

    let latestInteractions = [];
    function renderInteractions(features) {
      const filtered = features.filter(f => enabledKinds.has(f.properties.kind));

      // Star layer
      interactionSource.clear();
      const olFeatures = new ol.format.GeoJSON().readFeatures(
        { type: 'FeatureCollection', features: filtered },
        { featureProjection: 'EPSG:3857' }
      );
      interactionSource.addFeatures(olFeatures);

      // Side panel
      ixCount.textContent = `${filtered.length} shown · ${features.length} total`;
      ixList.replaceChildren();
      if (!filtered.length) {
        const li = document.createElement('li');
        li.className = 'ix-empty';
        li.textContent = features.length === 0
          ? 'No interactions yet.'
          : 'No interactions match the active filters.';
        ixList.appendChild(li);
        return;
      }

      filtered.slice(0, 80).forEach(f => {
        const p = f.properties;
        const li = document.createElement('li');

        const row1 = document.createElement('div');
        row1.className = 'ix-row';
        const left = document.createElement('div');

        const tag = document.createElement('span');
        tag.className = 'ix-kind';
        if (p.active) tag.classList.add('ix-active');
        tag.style.background = KIND_COLORS[p.kind];
        tag.textContent = p.kind;
        left.appendChild(tag);

        const info = document.createElement('span');
        info.textContent = ' ⓘ';
        info.style.cursor = 'pointer';
        info.style.color = '#1976d2';
        info.style.marginLeft = '4px';
        info.style.fontWeight = 'bold';
        info.dataset.role = 'info';
        info.dataset.kind = p.kind;
        info.title = 'Click to show / hide details';
        left.appendChild(info);

        const right = document.createElement('span');
        right.style.color = '#666';
        right.style.fontSize = '11px';
        right.textContent = fmtDuration(p.duration_s);
        row1.append(left, right);

        const row2 = document.createElement('div');
        row2.style.marginTop = '4px';
        row2.textContent = `${p.asset_a_name} ↔ ${p.asset_b_name}`;

        const row3 = document.createElement('div');
        row3.className = 'ix-meta';
        const started = new Date(p.started_at).toLocaleTimeString();
        row3.textContent = p.active
          ? `since ${started}`
          : `${started} → ${new Date(p.ended_at).toLocaleTimeString()}`;

        // Collapsible metadata panel — click ⓘ to toggle.
        const meta = document.createElement('div');
        meta.className = 'ix-meta-detail';
        meta.style.display = 'none';
        meta.style.marginTop = '6px';
        meta.style.padding = '6px 8px';
        meta.style.background = '#f7f7f9';
        meta.style.borderLeft = `3px solid ${KIND_COLORS[p.kind]}`;
        meta.style.borderRadius = '3px';
        meta.style.fontSize = '11px';
        meta.style.color = '#333';
        meta.style.whiteSpace = 'pre-line';

        function buildMetaText() {
          const m = kindMeta[p.kind];
          const ruleLine = m
            ? `Rule: ${m.type_a} ↔ ${m.type_b}, within ${m.distance_m} m for ≥ ${m.min_duration_s}s`
            : `Rule: ${p.kind}`;
          return [
            ruleLine,
            '',
            `A: ${p.asset_a_name}  (${p.asset_a_type}, id ${p.asset_a_id})`,
            `B: ${p.asset_b_name}  (${p.asset_b_type}, id ${p.asset_b_id})`,
            '',
            `started ${new Date(p.started_at).toLocaleString()}`,
            p.ended_at
              ? `ended   ${new Date(p.ended_at).toLocaleString()}`
              : `(still active)`,
            `at ${f.geometry.coordinates[1].toFixed(5)}, ${f.geometry.coordinates[0].toFixed(5)}`,
          ].join('\n');
        }
        meta.textContent = buildMetaText();
        meta.dataset.kind = p.kind;
        meta.dataset.role = 'info-meta';

        info.addEventListener('click', evt => {
          evt.stopPropagation();
          if (meta.style.display === 'none') {
            meta.textContent = buildMetaText();   // refresh in case rules just loaded
            meta.style.display = 'block';
          } else {
            meta.style.display = 'none';
          }
        });

        li.append(row1, row2, row3, meta);
        li.addEventListener('click', () => {
          // (a) Highlight the two parties.
          highlightedAssetIds = new Set([p.asset_a_id, p.asset_b_id]);
          vectorLayer.changed();

          // (b) Pinpoint the meeting location with a circular border.
          //     Radius = the rule's proximity threshold; falls back to 100 m
          //     if rules haven't loaded yet.
          encounterSource.clear();
          const ruleRadius = (kindMeta[p.kind]?.distance_m) || 100;
          const [mlon, mlat] = f.geometry.coordinates;
          encounterSource.addFeature(new ol.Feature({
            geometry: geographicCirclePolygon(mlon, mlat, ruleRadius),
            kind: p.kind,
          }));

          // (c) Zoom to fit both parties and the encounter circle.
          const coords = [];
          vectorSource.forEachFeature(feat => {
            if (feat.get('id') === p.asset_a_id || feat.get('id') === p.asset_b_id) {
              coords.push(feat.getGeometry().getCoordinates());
            }
          });
          coords.push(ol.proj.fromLonLat([mlon, mlat]));
          const xs = coords.map(c => c[0]);
          const ys = coords.map(c => c[1]);
          map.getView().fit(
            [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)],
            { padding: [120, 120, 120, 120], maxZoom: 17, duration: 500 }
          );
        });
        ixList.appendChild(li);
      });
    }

    async function refreshInteractions() {
      try {
        const res = await fetch(`${API_ROOT}/interactions?limit=200`,
                                { cache: 'no-store' });
        const data = await res.json();
        latestInteractions = data.features || [];
        renderInteractions(latestInteractions);
      } catch (err) {
        console.error('interactions fetch failed', err);
        ixCount.textContent = 'API error';
      }
    }

    refreshInteractions();
    setInterval(refreshInteractions, 5000);

    enterLive();
  </script>
</body>
</html>
