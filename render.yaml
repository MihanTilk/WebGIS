# Render Blueprint — runs the Flask API + static frontend on Render (both free,
# no expiry). The PostGIS database lives on Neon: Render's free Postgres expires
# every 30 days, Neon's free tier does not. The simulator runs locally; point it
# at the deployed API by setting API_BASE in your shell.
#
# Manual post-deploy steps:
#   1. Create a Neon project (Postgres 16, region near Singapore), copy its
#      connection string, and set it as the DATABASE_URL env var on the
#      asset-tracking-api service (declared below as sync:false). Then seed the
#      empty Neon DB in one command:
#        python backend/seed_db.py --dsn "postgresql://USER:PASS@HOST/DB?sslmode=require"
#      (Applies 01 -> 03 -> 05 -> 04. Note 05 runs before 04: 04 only backfills
#      the 25 past interactions if the interactions table already exists.)
#   2. Set the api-root meta tag in frontend/index.html to the deployed
#      backend URL (Render → asset-tracking-api → top of page), commit, push.

services:
  # Flask API
  - type: web
    name: asset-tracking-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60 app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: FLASK_DEBUG
        value: "0"
      # DATABASE_URL holds the Neon connection string. Set its value in the
      # Render dashboard (sync:false keeps the secret out of git).
      - key: DATABASE_URL
        sync: false

  # Static frontend
  - type: web
    name: asset-tracking-frontend
    runtime: static
    rootDir: frontend
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /*
        name: Cache-Control
        value: "no-cache"
