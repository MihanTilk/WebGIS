# Render Blueprint — provisions Postgres+PostGIS, the Flask API, and the
# static frontend. The simulator runs locally (Render workers are no longer
# free); point it at the deployed API by setting API_BASE in your shell.
#
# Manual post-deploy steps:
#   1. Apply sql/01_schema.sql + sql/03_history.sql + sql/04_clustered_seed.sql
#      + sql/05_interactions.sql against the new DB (External Connection
#      String from Render → Databases → asset-tracking-db → Connect).
#   2. Set the api-root meta tag in frontend/index.html to the deployed
#      backend URL (Render → asset-tracking-api → top of page), commit, push.

databases:
  - name: asset-tracking-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"

services:
  # Flask API
  - type: web
    name: asset-tracking-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60 app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: FLASK_DEBUG
        value: "0"
      - key: DB_HOST
        fromDatabase:
          name: asset-tracking-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: asset-tracking-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: asset-tracking-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: asset-tracking-db
          property: user
      - key: DB_PASS
        fromDatabase:
          name: asset-tracking-db
          property: password

  # Static frontend
  - type: web
    name: asset-tracking-frontend
    runtime: static
    rootDir: frontend
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /*
        name: Cache-Control
        value: "no-cache"
